<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grilla del 1 al 11 de octubre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --paper:#ffffff;--ink:#111111;--ink-soft:#333333;--muted:#767672;
    --line:#e2e2dc;--board:#f1f1ec;--col:#e6e6df;--yellow:#ffcd11;
    --ok:#4bce97;--fix:#e2483d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--board);color:var(--ink);display:flex;flex-direction:column;
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit}
  .brandbar{height:3px;background:var(--yellow);flex:0 0 auto}

  .top{background:var(--paper);border-bottom:1px solid var(--line);flex:0 0 auto}
  .top-inner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px}
  .wordmark{display:flex;align-items:baseline;gap:7px}
  .wordmark .product{font-size:13px;color:var(--ink-soft)}
  .wordmark .dot{width:5px;height:5px;border-radius:50%;background:var(--yellow);align-self:center}
  .wordmark .lego{font-weight:700;font-size:18px;letter-spacing:-.03em;line-height:1}
  .wordmark .mkt{font-weight:600;font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .sep{width:1px;height:26px;background:var(--line)}
  .heading{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
  .kicker{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  .kicker::before{content:"";width:8px;height:8px;background:var(--yellow)}
  .heading h1{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .heading .subtitle{font-size:13px;color:var(--muted)}
  .hint{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

  /* Tablero: columnas por día que se desplazan a la derecha; cada columna se desplaza hacia abajo por dentro */
  .board{
    flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;gap:12px;
    overflow-x:auto;overflow-y:hidden;padding:16px 20px 18px;scroll-snap-type:x proximity;
  }
  .col{
    flex:0 0 284px;max-height:100%;display:flex;flex-direction:column;
    background:var(--col);border-radius:14px;scroll-snap-align:start;
  }
  .col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px}
  .col-name{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .col-count{font-size:12px;color:var(--muted);font-weight:600}
  .col-cards{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:9px}
  .card{
    display:block;flex:0 0 auto;width:100%;text-align:left;background:var(--paper);border:0;border-radius:10px;
    overflow:hidden;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.12);transition:box-shadow .12s, transform .12s;
  }
  .card:hover{box-shadow:0 0 0 2px var(--ink)}
  .card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .cover{position:relative;background:#1b1b1b}
  .cover img{display:block;width:100%;max-height:360px;object-fit:cover;object-position:top}
  .play{
    position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  }
  .play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .count-badge{
    position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;
    border-radius:99px;padding:3px 9px;
  }
  .card-body{padding:9px 12px 11px}
  .label{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    border-radius:4px;padding:2px 8px;margin-bottom:6px;background:var(--yellow);color:var(--ink)}
  .label.ok{background:var(--ok)}
  .label.fix{background:var(--fix);color:#fff}
  .card-title{font-size:13.5px;font-weight:500;line-height:1.35}
  .meta{display:flex;gap:12px;margin-top:7px;color:var(--muted);font-size:12px;align-items:center}
  .meta svg{width:14px;height:14px;vertical-align:-2px;margin-right:3px}

  /* Visor de la pieza */
  .viewer{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.82);display:none;align-items:center;justify-content:center;padding:24px}
  .viewer.open{display:flex}
  .sheet{
    background:var(--paper);border-radius:14px;overflow:hidden;width:min(1120px,100%);max-height:100%;
    display:grid;grid-template-columns:minmax(0,1fr) 380px;
  }
  .stage{background:#161616;display:flex;flex-direction:column;min-height:0}
  .stage-main{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}
  .stage-main img,.stage-main video{max-width:100%;max-height:calc(100vh - 170px);display:block;border-radius:6px;background:#161616}
  .nav{
    position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.9);font-size:22px;line-height:44px;text-align:center;
  }
  .nav.prev{left:12px}.nav.next{right:12px}
  .nav:hover{background:var(--yellow)}
  .strip{display:flex;gap:8px;padding:0 18px 16px;overflow-x:auto;justify-content:center}
  .strip button{border:2px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;flex:0 0 auto;opacity:.6}
  .strip button.on{border-color:var(--yellow);opacity:1}
  .strip img{display:block;height:64px;border-radius:4px}
  .info{padding:22px 24px;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
  .info-top{display:flex;align-items:flex-start;gap:10px}
  .info-day{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .info h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:4px;line-height:1.3}
  .close{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;padding:0 4px;color:var(--ink-soft)}
  .close:hover{color:var(--ink)}
  .info .label{margin:12px 0 0}
  .copy{white-space:pre-line;color:var(--ink-soft);font-size:14px;line-height:1.65;margin-top:16px;overflow-y:auto;min-height:0;flex:1 1 auto}
  .copy.empty{color:var(--muted);font-style:italic}
  .actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:16px;margin-top:14px;border-top:1px solid var(--line)}
  .btn{
    font-size:12px;font-weight:600;letter-spacing:.02em;border-radius:8px;padding:9px 14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.12s;border:1px solid var(--ink);
  }
  .btn.light{background:var(--paper);color:var(--ink)}
  .btn.dark{background:var(--ink);color:var(--paper)}
  .btn.dark::after{content:"\2193";font-weight:700}
  .btn:hover,.btn.ok{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
  .btn.busy{opacity:.6;pointer-events:none}

  @media (max-width:820px){
    .top-inner{padding:10px 14px;gap:10px}
    .sep,.hint{display:none}
    .heading h1{font-size:16px}
    .board{padding:12px 14px 14px;scroll-snap-type:x mandatory}
    .col{flex-basis:82vw}
    .viewer{padding:0}
    .sheet{grid-template-columns:1fr;border-radius:0;height:100%;overflow-y:auto;grid-template-rows:auto auto}
    .stage-main img,.stage-main video{max-height:68vh}
    .info{border-left:0}
    .copy{overflow:visible}
  }
</style>
</head>

    <div class="wordmark"><span class="product">entregas</span><span class="dot"></span><span class="lego">lego</span><span class="mkt">mkt</span></div>

        <button class="btn dark" id="v-dl">Descargar</button>
        <button class="btn light" id="v-dlall">Descargar todas</button>
      </div>
    </div>
  </div>
</div>

var ICON_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg>';
var ICON_CLIP = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4.5 5.4 9.6a1.6 1.6 0 0 0 2.3 2.3l5.4-5.4a3 3 0 0 0-4.3-4.3L3.5 7.5a4.4 4.4 0 0 0 6.2 6.2L13 10.4"/></svg>';
function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function labelHtml(t){
  if(!t) return "";
  var k=t.toLowerCase(), cls=/aprob/.test(k)?" ok":(/correg|cambio/.test(k)?" fix":"");
  return '<span class="label'+cls+'">'+esc(t)+'</span>';
}

var board=document.getElementById("board");
DATA.forEach(function(col, ci){
  var el=document.createElement("section"); el.className="col";
  el.innerHTML='<div class="col-head"><span class="col-name">'+esc(col.nombre)+'</span><span class="col-count">'+col.cards.length+'</span></div><div class="col-cards"></div>';
  var list=el.querySelector(".col-cards");
  col.cards.forEach(function(card, ki){
    var f=card.files[0], b=document.createElement("button"); b.className="card"; b.type="button";
    var cover = f && f.thumb ? '<div class="cover"><img loading="lazy" alt="" style="aspect-ratio:'+f.ratio+'" src="'+f.thumb+'">'
      + (f.kind==="video" ? '<span class="play"></span>' : '')
      + (card.files.length>1 ? '<span class="count-badge">'+card.files.length+' slides</span>' : '') + '</div>' : '';
    b.innerHTML = cover + '<div class="card-body">'+labelHtml(card.etiqueta)+'<div class="card-title">'+esc(card.titulo)+'</div>'
      + '<div class="meta">'+(card.copy?'<span>'+ICON_COPY+'</span>':'')+(card.files.length?'<span>'+ICON_CLIP+card.files.length+'</span>':'')+'</div></div>';
    b.addEventListener("click", function(){ openCard(ci, ki); });
    list.appendChild(b);
  });
  board.appendChild(el);
});

/* Visor */
var viewer=document.getElementById("viewer"), cur=null, idx=0, lastFocus=null;
function openCard(ci, ki){
  lastFocus=document.activeElement;
  var col=DATA[ci], card=col.cards[ki]; cur=card; idx=0;
  document.getElementById("v-day").textContent=col.nombre;
  document.getElementById("v-title").textContent=card.titulo;
  document.getElementById("v-label").innerHTML=labelHtml(card.etiqueta);
  var c=document.getElementById("v-copy");
  c.textContent=card.copy||"Sin copy (pieza de historia o de referencia).";
  c.className="copy"+(card.copy?"":" empty");
  document.getElementById("v-copybtn").style.display=card.copy?"":"none";
  document.getElementById("v-dlall").style.display=card.files.length>1?"":"none";
  var strip=document.getElementById("v-strip"); strip.innerHTML="";
  if(card.files.length>1) card.files.forEach(function(f,i){
    var t=document.createElement("button"); t.type="button"; t.setAttribute("aria-label","Slide "+(i+1));
    t.innerHTML='<img alt="" src="'+f.thumb+'">'; t.addEventListener("click",function(){ show(i); }); strip.appendChild(t);
  });
  show(0);
  viewer.classList.add("open"); document.body.style.overflow="hidden";
  document.getElementById("v-close").focus();
}
function show(i){
  var files=cur.files; if(!files.length){ document.getElementById("v-media").innerHTML=""; return; }
  idx=(i+files.length)%files.length; var f=files[idx], m=document.getElementById("v-media");
  var media = f.kind==="video"
    ? '<video controls playsinline preload="metadata" '+(f.poster?'poster="'+f.poster+'" ':'')+'style="aspect-ratio:'+f.ratio+'" src="'+f.src+'"></video>'
    : '<img alt="" style="aspect-ratio:'+f.ratio+'" src="'+f.view+'">';
  var nav = files.length>1 ? '<button class="nav prev" type="button" aria-label="Anterior">‹</button><button class="nav next" type="button" aria-label="Siguiente">›</button>' : '';
  m.innerHTML = media + nav;
  if(files.length>1){
    m.querySelector(".prev").onclick=function(){ show(idx-1); };
    m.querySelector(".next").onclick=function(){ show(idx+1); };
  }
  [].forEach.call(document.querySelectorAll("#v-strip button"),function(b,j){ b.classList.toggle("on", j===idx); });
  document.getElementById("v-dl").textContent = files.length>1 ? "Descargar slide "+(idx+1) : (f.kind==="video"?"Descargar video":"Descargar imagen");
}
function closeViewer(){
  var v=document.querySelector("#v-media video"); if(v) v.pause();
  viewer.classList.remove("open"); document.body.style.overflow=""; cur=null;
  if(lastFocus) lastFocus.focus();
}
document.getElementById("v-close").onclick=closeViewer;
viewer.addEventListener("click",function(e){ if(e.target===viewer) closeViewer(); });
document.addEventListener("keydown",function(e){
  if(!cur) return;
  if(e.key==="Escape") closeViewer();
  else if(e.key==="ArrowRight" && cur.files.length>1) show(idx+1);
  else if(e.key==="ArrowLeft" && cur.files.length>1) show(idx-1);
});

document.getElementById("v-copybtn").onclick=function(){
  var btn=this, text=cur.copy;
  var done=function(){ btn.textContent="Copiado ✓"; btn.classList.add("ok"); setTimeout(function(){ btn.textContent="Copiar texto"; btn.classList.remove("ok"); },1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
  function fallback(){ var t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); done();}catch(e){} document.body.removeChild(t); }
};
/* Descarga sin salir de la página (fetch + Blob); si no hay fetch, cae al <a download> nativo */
function download(f, btn){
  var a=document.createElement("a"); a.download=f.dl;
  if(!(window.fetch && window.Blob && window.URL && URL.createObjectURL)){ a.href=f.src; document.body.appendChild(a); a.click(); a.remove(); return Promise.resolve(); }
  if(btn) btn.classList.add("busy");
  return fetch(f.src).then(function(r){ return r.blob(); }).then(function(b){
    var u=URL.createObjectURL(b); a.href=u; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
  }).catch(function(){ a.href=f.src; document.body.appendChild(a); a.click(); a.remove(); })
    .then(function(){ if(btn) btn.classList.remove("busy"); });
}
document.getElementById("v-dl").onclick=function(){ download(cur.files[idx], this); };
document.getElementById("v-dlall").onclick=function(){
  var btn=this, files=cur.files.slice(), i=0; btn.classList.add("busy");
  (function next(){ if(i>=files.length){ btn.classList.remove("busy"); return; } download(files[i++]).then(function(){ setTimeout(next, 350); }); })();
};
</script>
